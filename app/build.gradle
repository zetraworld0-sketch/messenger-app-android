apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "org.mesibo.messenger" 
        minSdkVersion 21
        targetSdkVersion 34 
        versionCode 1
        versionName "1.0.0"
        
        buildConfigField "String", "BUILD_VERSION", "\"1.0.0\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${new java.util.Date().toString()}\""
        
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
      sourceCompatibility JavaVersion.VERSION_1_8
      targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Core AndroidX
    implementation "androidx.appcompat:appcompat:1.1.0"
    implementation "com.google.android.material:material:1.5.0"

    // Mesibo v2 - Using '+' to bypass POM parsing errors for specific sub-versions
    implementation "com.mesibo.api:mesibo:2.+"
    implementation "com.mesibo.api:ui:2.+"
    implementation "com.mesibo.api:uihelper:2.+"
    implementation "com.mesibo.api:callui:2.+"

    // Butterknife & Utils
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation "com.google.code.gson:gson:2.8.6"
    implementation "com.google.firebase:firebase-messaging:18.0.0"
}
