apply plugin: 'com.android.application'

ext {
    PUBLISH_VERSION = "1.0.0"
    PUBLISH_VERSION_CODE = 1
    
    // Using v2.x for institutional-grade stability
    mesibo_api_version = "2.+" 
    mesibo_ui_version = "2.+"
    mesibo_uihelper_version = "2.+"
    mesibo_callui_version = "2.+"
    play_services_version = "17.0.0"
}

// Ensure the app module knows where to find Mesibo artifacts
repositories {
    google()
    mavenCentral()
    maven { url 'https://mesibo.com/maven' }
}

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "org.mesibo.messenger" 
        
        minSdkVersion 21
        targetSdkVersion 34 
        versionCode project.PUBLISH_VERSION_CODE
        versionName project.PUBLISH_VERSION
        
        buildConfigField "String", "BUILD_VERSION", "\"${project.PUBLISH_VERSION}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${new java.util.Date().toString()}\""
        
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    lintOptions {
        disable 'MissingTranslation'
        abortOnError false 
    }

    compileOptions {
      sourceCompatibility JavaVersion.VERSION_1_8
      targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Testing
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'

    // AndroidX & Material UI
    implementation "androidx.appcompat:appcompat:1.1.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.1.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.annotation:annotation:1.1.0"
    implementation "androidx.preference:preference:1.1.0"
    implementation "com.google.android.material:material:1.5.0"

    // Google Services
    implementation "com.google.android.gms:play-services-maps:${project.play_services_version}"
    implementation "com.google.android.gms:play-services-location:${project.play_services_version}"
    implementation "com.google.firebase:firebase-messaging:18.0.0"
    implementation 'com.google.firebase:firebase-core:16.0.9'

    // Utilities
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    
    // Butterknife for AndroidX
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    
    implementation "com.google.code.gson:gson:2.8.6"

    // Mesibo Core Dependencies (v2.x branch)
    implementation "com.mesibo.api:mesibo:${project.mesibo_api_version}"
    implementation "com.mesibo.api:ui:${project.mesibo_ui_version}"
    implementation "com.mesibo.api:uihelper:${project.mesibo_uihelper_version}"
    implementation "com.mesibo.api:callui:${project.mesibo_callui_version}"
}

apply plugin: 'com.google.gms.google-services'
